{% extends 'base.html' %}

{% block title_block %}
  Django ORM
{% endblock %}

{% block body_block %}
  <div class="row">
    <div class="col-6 mt-4">
      {% for restaurant in restaurants %}
        <p>{{ restaurant.name }}</p>
        <ul>
          {% for rating in restaurant.ratings.all %}
            <li>
              <p>{{ rating.rating }}</p>
            </li>
          {% endfor %}
        </ul>
      {% endfor %}
    </div>
  </div>
{% endblock %}
